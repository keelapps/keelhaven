# Keeps a draft release ("what's shipped since the last tag") up to date and
# autolabels PRs by branch prefix / title. Thin caller — the action, its
# version pin, and every rule live in the org repo:
# https://github.com/keelapps/.github (.github/release-drafter.yml).
#
# The draft is living release notes only; actual releases stay tag-driven
# (release.yml). After a tag is published, the next merge to main rebuilds
# the draft with only the newer PRs.
name: Release Drafter

on:
  push:
    branches:
      - main
  # Autolabeler needs PR events. `_target` (not `pull_request`) so PRs from
  # forks can be labeled too — safe because no PR code is checked out.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions: {}

jobs:
  draft-release:
    permissions:
      contents: write
      pull-requests: write
    uses: keelapps/.github/.github/workflows/release-drafter.yml@main
