name: Website

# Builds the public website (site/, VitePress) and pushes the static output to
# the public keelapps/keelhaven-site repo, which GitHub Pages serves at
# https://keelhaven.app/. This keeps the doc sources in this private repo
# without needing a paid GitHub plan for Pages. See docs/WEBSITE.md for how
# the domain is wired up.
#
# Runs on ubuntu (bills at 1×, unlike the 10× macOS jobs in ci.yml) and only
# when site content actually changes, so it barely touches the minutes quota.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/website.yml
  # release.yml's tag-push path publishes a GitHub Release on the private
  # keelapps/keelhaven repo — this is the only trigger that fires right
  # after one lands, so the mirror step below gets a chance to run before
  # anyone notices the download is stale.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Runs on every deploy, not just the release trigger above — force_orphan
      # below replaces gh-pages wholesale each time, so a docs-only push would
      # otherwise wipe out whatever DMG a prior release run had mirrored here.
      # Keelhaven has no public releases yet, so this no-ops until the first
      # `git tag vX.Y.Z` — that's expected, not a bug.
      - name: Mirror latest release DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/public/downloads
          if ! gh release view --repo keelapps/keelhaven --json tagName,assets > /tmp/release.json 2>/tmp/release.err; then
            echo "No published release yet — skipping DMG mirror ($(cat /tmp/release.err))"
            exit 0
          fi
          TAG=$(jq -r .tagName /tmp/release.json)
          VERSION="${TAG#v}"
          ASSET=$(jq -r '.assets[] | select(.name | endswith(".dmg")) | .name' /tmp/release.json | head -n1)
          if [ -z "$ASSET" ]; then
            echo "Latest release $TAG has no .dmg asset — skipping mirror"
            exit 0
          fi
          gh release download "$TAG" --repo keelapps/keelhaven --pattern '*.dmg' --dir site/public/downloads --clobber
          printf '{"version": "%s", "dmgURL": "https://keelhaven.app/downloads/%s"}\n' "$VERSION" "$ASSET" > site/public/latest.json
      - name: Build site
        run: |
          npm ci --prefix site
          npm run build --prefix site
      # SITE_DEPLOY_KEY is the private half of a deploy key whose public half
      # is registered (write-enabled) on keelapps/keelhaven-site.
      - name: Publish to keelapps/keelhaven-site
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: keelapps/keelhaven-site
          publish_branch: gh-pages
          publish_dir: site/.vitepress/dist
          # force_orphan replaces gh-pages wholesale, so anything not in
          # `dist` is gone after every deploy — including the CNAME file that
          # keeps keelhaven.app attached. That file therefore lives in
          # site/public/CNAME and rides along in the build output; deleting it
          # takes the custom domain offline on the next push.
          force_orphan: true
