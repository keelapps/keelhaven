name: Website

# Builds the public website (site/, VitePress) and force-pushes the static
# output to this repo's gh-pages branch, which GitHub Pages serves at
# https://keelhaven.app/. One repo, no deploy keys — the separate site repo
# retired when this repo went public. See docs/WEBSITE.md for how the domain
# is wired up.
#
# Runs on ubuntu (bills at 1×, unlike the 10× macOS jobs in ci.yml) and only
# when site content actually changes.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/website.yml
  # release.yml's tag-push path publishes a GitHub Release — this is the
  # only trigger that fires right after one lands, so the mirror step below
  # gets a chance to run before anyone notices the download is stale.
  release:
    types: [published]
  workflow_dispatch:

# The workflow's own GITHUB_TOKEN pushes gh-pages — no cross-repo deploy key.
permissions:
  contents: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Runs on every deploy, not just the release trigger above — force_orphan
      # below replaces gh-pages wholesale each time, so a docs-only push would
      # otherwise wipe out whatever DMG a prior release run had mirrored here.
      # Keelhaven has no public releases yet, so this no-ops until the first
      # `git tag vX.Y.Z` — that's expected, not a bug.
      - name: Mirror latest release DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/public/downloads
          if ! gh release view --repo keelapps/keelhaven --json tagName,assets > /tmp/release.json 2>/tmp/release.err; then
            echo "No published release yet — skipping DMG mirror ($(cat /tmp/release.err))"
            exit 0
          fi
          TAG=$(jq -r .tagName /tmp/release.json)
          VERSION="${TAG#v}"
          ASSET=$(jq -r '.assets[] | select(.name | endswith(".dmg")) | .name' /tmp/release.json | head -n1)
          if [ -z "$ASSET" ]; then
            echo "Latest release $TAG has no .dmg asset — skipping mirror"
            exit 0
          fi
          gh release download "$TAG" --repo keelapps/keelhaven --pattern '*.dmg' --dir site/public/downloads --clobber
          printf '{"version": "%s", "dmgURL": "https://keelhaven.app/downloads/%s"}\n' "$VERSION" "$ASSET" > site/public/latest.json
      - name: Build site
        run: |
          npm ci --prefix site
          npm run build --prefix site
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site/.vitepress/dist
          # force_orphan replaces gh-pages wholesale, so anything not in
          # `dist` is gone after every deploy — including the CNAME file that
          # keeps keelhaven.app attached. That file therefore lives in
          # site/public/CNAME and rides along in the build output; deleting it
          # takes the custom domain offline on the next push.
          force_orphan: true
