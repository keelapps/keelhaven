name: CI

# macOS runners bill at 10× against the private-repo minutes quota, so this
# workflow is deliberately stingy (the quota ran dry once — 2026-08-15):
#   - docs/site/design-script changes skip CI entirely (the generated assets
#     under Keelhaven/ still trigger it, so app-affecting changes are covered)
#   - the app build lives in build-app.yml now and runs only when asked for;
#     it used to run twice on every main push at ~20 billed minutes a time
#   - a main push that is a squash-merge of an already-green PR skips the
#     tests it just ran (see the `if` on core-tests)
#   - a newer push to the same branch cancels the run it supersedes
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - design/**
      - .gitignore
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - design/**
      - .gitignore
  # Escape hatch for the squash-merge skip below, and for re-running after a
  # paths-ignore'd change that turned out to matter after all.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: KeelhavenCore tests
    runs-on: macos-15
    # A hung `swift test` would otherwise burn to the 6-hour default, which on
    # a 10× runner is 3600 billed minutes.
    timeout-minutes: 20
    # Skip main pushes that are squash-merges of a PR — GitHub writes the PR
    # number into the subject as "(#123)", and those exact tests went green on
    # the PR minutes earlier. Direct pushes to main (the common workflow here)
    # still run in full.
    #
    # The heuristic is deliberately blunt: a hand-written commit message that
    # happens to contain "(#" also skips. If that happens, re-run via
    # workflow_dispatch above.
    if: >-
      github.event_name != 'push'
      || !contains(github.event.head_commit.message, '(#')
    steps:
      - uses: actions/checkout@v7
      # The integration test suite exercises the real restic binary end-to-end
      # (it self-skips when restic is missing, but we want it running in CI).
      - name: Install restic
        # untap: the runner image ships an untrusted aws/tap that makes every
        # brew command print tap-trust warnings; we don't use it.
        run: |
          brew untap aws/tap || true
          brew install restic
      - name: Run tests
        run: swift test --package-path KeelhavenCore --enable-code-coverage
      # KeelhavenCore is fully unit-tested and stays that way: any core code
      # added without tests turns this red.
      - name: Enforce 100% line coverage
        run: |
          BIN=$(swift build --package-path KeelhavenCore --show-bin-path)
          XCTEST="$BIN/KeelhavenCorePackageTests.xctest/Contents/MacOS/KeelhavenCorePackageTests"
          COVERAGE=$(xcrun llvm-cov export "$XCTEST" \
            -instr-profile="$BIN/codecov/default.profdata" \
            -ignore-filename-regex="Tests|\.build" \
            -summary-only \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['data'][0]['totals']['lines']['percent'])")
          echo "KeelhavenCore line coverage: ${COVERAGE}%"
          python3 -c "import sys; sys.exit(0 if float('${COVERAGE}') >= 100.0 else 1)" \
            || { echo "::error::KeelhavenCore line coverage is ${COVERAGE}%, below 100%"; exit 1; }
