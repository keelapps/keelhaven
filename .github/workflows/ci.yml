name: CI

# macOS runners bill at 10× against the private-repo minutes quota, so this
# workflow is deliberately stingy (the quota ran dry once — 2026-08-15):
#   - docs/site/design-script changes skip CI entirely (the generated assets
#     under Keelhaven/ still trigger it, so app-affecting changes are covered)
#   - PRs run only the core tests; the two build-app jobs run on main only,
#     which is also where Scripts/install-latest.sh downloads artifacts from
#   - a newer push to the same branch cancels the run it supersedes
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - design/**
      - .gitignore
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - design/**
      - .gitignore

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: KeelhavenCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # The integration test suite exercises the real restic binary end-to-end
      # (it self-skips when restic is missing, but we want it running in CI).
      - name: Install restic
        # untap: the runner image ships an untrusted aws/tap that makes every
        # brew command print tap-trust warnings; we don't use it.
        run: |
          brew untap aws/tap || true
          brew install restic
      - name: Run tests
        run: swift test --package-path KeelhavenCore --enable-code-coverage
      # KeelhavenCore is fully unit-tested and stays that way: any core code
      # added without tests turns this red.
      - name: Enforce 100% line coverage
        run: |
          BIN=$(swift build --package-path KeelhavenCore --show-bin-path)
          XCTEST="$BIN/KeelhavenCorePackageTests.xctest/Contents/MacOS/KeelhavenCorePackageTests"
          COVERAGE=$(xcrun llvm-cov export "$XCTEST" \
            -instr-profile="$BIN/codecov/default.profdata" \
            -ignore-filename-regex="Tests|\.build" \
            -summary-only \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['data'][0]['totals']['lines']['percent'])")
          echo "KeelhavenCore line coverage: ${COVERAGE}%"
          python3 -c "import sys; sys.exit(0 if float('${COVERAGE}') >= 100.0 else 1)" \
            || { echo "::error::KeelhavenCore line coverage is ${COVERAGE}%, below 100%"; exit 1; }

  build-app:
    name: Build app (${{ matrix.label }})
    runs-on: macos-15
    # Artifacts are only ever installed from main (Scripts/install-latest.sh
    # takes the newest successful main run), so PR pushes skip both build
    # jobs — that's ~2/3 of the billed minutes per push. The app target still
    # can't rot unreviewed: it builds on every merge, and locally via `make`.
    if: github.event_name == 'push'
    # One artifact per architecture: bundling only the matching restic slice
    # halves the download compared to a universal build.
    strategy:
      matrix:
        include:
          - label: apple-silicon
            restic_arch: arm64
            xcode_archs: arm64
          - label: intel
            restic_arch: amd64
            xcode_archs: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: |
          brew untap aws/tap || true
          brew install xcodegen
      - name: Vendor restic (checksum-verified)
        run: ./Scripts/fetch-restic.sh ${{ matrix.restic_arch }}
      - name: Generate Xcode project
        run: xcodegen generate
      # Ad-hoc signing (identity "-"): runnable on any Mac after removing the
      # quarantine attribute, good enough for personal installs from the
      # artifact below. Public distribution still needs a Developer ID cert
      # + notarization, added once those are in repo secrets.
      - name: Build Release
        run: >
          xcodebuild
          -project Keelhaven.xcodeproj
          -scheme Keelhaven
          -configuration Release
          -derivedDataPath build
          build
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          ARCHS=${{ matrix.xcode_archs }}
          ONLY_ACTIVE_ARCH=NO
      - name: Zip app
        run: ditto -c -k --keepParent build/Build/Products/Release/Keelhaven.app Keelhaven.app.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Keelhaven-${{ github.run_number }}-${{ matrix.label }}
          path: Keelhaven.app.zip
          if-no-files-found: error
