# Path → area label map for .github/workflows/labeler.yml (actions/labeler).
# Area labels only — type labels (enhancement, bug, chore…) come from the
# branch prefix via release-drafter's autolabeler, configured org-wide in
# keelapps/.github.

core:
  - changed-files:
      - any-glob-to-any-file: KeelhavenCore/**

app:
  - changed-files:
      - any-glob-to-any-file:
          - Keelhaven/**
          - project.yml

website:
  - changed-files:
      - any-glob-to-any-file: site/**

design:
  - changed-files:
      - any-glob-to-any-file: design/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "*.md"

ci:
  - changed-files:
      - any-glob-to-any-file: .github/**

tooling:
  - changed-files:
      - any-glob-to-any-file:
          - Scripts/**
          - Makefile

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - site/package.json
          - site/package-lock.json
