name: Feature request
description: Suggest something Keelhaven should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The most useful requests describe a problem rather than a solution.
        If we understand what you are actually trying to accomplish, we can
        often find a better answer than the one either of us started with.

        A few things — file-level restore browsing, retention policies, extra
        backends — are deliberately not built yet rather than forgotten; the
        list lives in the
        [architecture notes](https://github.com/shenxianpeng/keelhaven/blob/main/docs/ARCHITECTURE.md#not-yet-built-deliberately).
        Asking for one of them is still useful: it tells us how much it is
        missed.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        The task or obligation behind the request — the folders you have to
        protect, the schedule you have to keep, the restore you have to be
        able to make.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: How do you handle it today?
      description: >
        Scripts, another backup tool, restic directly, manual copies, or simply
        living with it. This tells us how much the gap actually costs.
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: What would you like Keelhaven to do?
      description: If you already have a specific shape in mind, describe it here.
    validations:
      required: false
